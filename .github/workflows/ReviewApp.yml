name: review-app
on:
  pull_request:
    branches:
    - main
    tags:
    - "*"
    types:
    - opened
    - synchronize
    - reopened
  pull_request_review:
    branches:
    - main
    tags:
    - "*"

permissions:
  id-token: write
  contents: read

jobs:
  review-app:
    if: |
      (github.event_name == 'pull_request_review' && github.event.review.state != 'commented') ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    name: "Call ReviewApp"
    uses: intel-innersource/frameworks.actions.pact.review-app/.github/workflows/ReviewApp.yml@v1
    with:
      pull_request_id: ${{ github.event.pull_request.number }}
      repository: ${{ github.event.repository.full_name }}
      AAM_SAFE: AAM-DV-40248-PACTTEST
      HOST_ID: HOST_ID_GENERATED_AFTER_TICKET_COMPLETION
      REVIEW_BOT_TOKEN_AAM_ACCOUNT_NAME: Operating System-UnmanagedAccounts-AllOSs-Token-GitHub-ReviewApp-sys-pt1s
      environment: testing
